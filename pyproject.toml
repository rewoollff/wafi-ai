[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.importlinter]
root_package = "wafi"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "wafi.api",
    "wafi.service",
    "wafi.adapters",
    "wafi.domain",
]