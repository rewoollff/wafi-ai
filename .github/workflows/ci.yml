name: Wafi CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      - name: Architecture check
        run: lint-imports

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test with coverage
        run: pytest -q --cov=src/wafi --cov-report=term-missing --cov-fail-under=80

  image-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail \
            -X POST http://localhost:8000/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"ticket_text":"The entire department cannot access the system","affected_users":50,"category":"system"}'

      - name: Stop services
        if: always()
        run: docker compose down

  publish:
    runs-on: ubuntu-latest
    needs: image-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}